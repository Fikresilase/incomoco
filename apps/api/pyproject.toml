[project]
name = "inkomoko-api"
version = "0.1.0"
description = "Inkomoko Assistant backend: FastAPI, RAG pipeline, ingestion worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "weaviate-client>=4.9",
    "minio>=7.2",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
