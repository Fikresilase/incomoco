# Single entry point for the whole app (see docker-compose.yml `proxy`).
# /api -> FastAPI (REST, SSE chat, live-talk WebSocket); everything else -> Next.js.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Keep the original scheme when a tunnel terminates HTTPS in front of us.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    client_max_body_size 26m;  # uploads are capped at 25 MB by the API

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;  # long voice sessions and streamed answers
    proxy_buffering off;       # stream SSE tokens and audio immediately

    location /api/ {
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
